<!doctype html>
<html lang="sv">
<head>
  <base href="/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bästa snuset enligt användarna | Snuskampen</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Snuskampen">
<meta property="og:title" id="ogt" content="Vilket snus vinner? – Snuskampen">
<meta property="og:description" content="Två snus. Du väljer. Vinnaren möter nästa.">
<meta property="og:image" content="https://snuskampen.se/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" id="metadesc" content="Två dosor. En vinnare. Rösta i duellen och se communityns ranking över snus och nikotinportioner. Baserat på användarnas röster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;--ink:#101820;--muted:#6b7280;--red:#e4002b;--blue:#0a4da6;
    --red-tint:#fff0f2;--blue-tint:#eef4fc;--line:#e6e6e6;--soft:#f6f6f4;
    --display:'Bebas Neue','Arial Narrow',Impact,sans-serif;
    --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;color:inherit}

  header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
  .logo{font-family:var(--display);font-size:30px;letter-spacing:.5px;text-decoration:none;line-height:1;white-space:nowrap}
  .logo b{color:var(--red);font-weight:400}
  nav{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{font-weight:600;font-size:13px;text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  nav a[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  nav a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .view{display:none;flex:1;min-height:0;flex-direction:column}
  .view.on{display:flex}
  .scroll{overflow:auto;flex:1;min-height:0;padding:24px 20px 80px}
  .wrap{max-width:760px;margin:0 auto;width:100%}
  h1{font-family:var(--display);font-size:clamp(40px,7vw,72px);margin:0 0 4px;line-height:.95}
  h2{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin:28px 0 10px;line-height:1}
  p.sub{color:var(--muted);margin:0 0 18px;font-size:15px}

  /* duel */
  .arena{flex:1;position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  .corner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 24px 32px;border:0;cursor:pointer;background:var(--paper);text-align:center;min-height:0;overflow:hidden;transition:background .15s}
  .corner.left:focus-visible{background:var(--red-tint);outline:none}
  .corner.right:focus-visible{background:var(--blue-tint);outline:none}
  @media (hover:hover) and (pointer:fine){
    .corner.left:hover{background:var(--red-tint)}
    .corner.right:hover{background:var(--blue-tint)}
  }
  .corner:active{background:var(--red-tint)}
  .corner.right:active{background:var(--blue-tint)}
  .corner.won{animation:pop .35s ease}
  @keyframes pop{40%{transform:scale(1.04)}}
  @media (prefers-reduced-motion:reduce){.corner.won{animation:none}}
  .can{width:min(52vw,240px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .can img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
  .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .fallback svg{width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.14))}
  .brand{font-size:14px;font-weight:600;color:var(--muted)}
  .name{font-family:var(--display);font-size:clamp(30px,5vw,54px);line-height:.95;margin:0}
  .meta{font-size:15px;color:var(--muted);margin:0}
  .dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--ink)}
  .streak{font-size:13px;font-weight:600;color:var(--red);background:var(--red-tint);padding:4px 10px;border-radius:999px}
  .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);width:84px;height:84px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-size:44px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;line-height:1;padding-top:4px;box-shadow:0 0 0 6px var(--paper)}
  .seam{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--line);pointer-events:none}
  .hint{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .hint kbd{font:600 12px var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:#fafafa;color:var(--ink)}
  .hint .acts{display:flex;gap:14px}
  .hint button{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-weight:600;font-size:13px;padding:0}

  /* chips + filters */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .chip{font-weight:600;font-size:13px;border:1px solid var(--line);background:none;padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .filters{display:grid;gap:8px;margin-bottom:16px;padding:12px;background:var(--soft);border-radius:12px}
  .frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .frow .lbl{font-size:12px;font-weight:600;color:var(--muted);width:56px}
  .chip.sm{font-size:12px;padding:4px 10px}
  select{font:600 13px var(--body);border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:999px;color:var(--ink)}
  .sel{display:flex;gap:6px;flex:none;margin-left:auto}
  .sel select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 8px;background:none;max-width:96px}

  /* list */
  ol.list{list-style:none;margin:0;padding:0}
  ol.list li{display:grid;grid-template-columns:44px 56px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  ol.list .rank{font-family:var(--display);font-size:34px;line-height:1}
  ol.list li:nth-child(1) .rank{color:var(--red)}
  .thumb{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
  .thumb .fallback svg{filter:none}
  ol.list .t{font-family:var(--display);font-size:24px;line-height:1}
  ol.list .t a{text-decoration:none}
  ol.list .s{font-size:12px;color:var(--muted);margin-top:2px}
  ol.list .score{text-align:right}
  ol.list .score b{font-family:var(--display);font-size:24px;font-weight:400;display:block;line-height:1}
  ol.list .score span{font-size:11px;color:var(--muted)}
  .empty{padding:32px 0;color:var(--muted)}
  .note{font-size:13px;color:var(--muted);margin:10px 0 0}

  /* winners */
  .winners{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .wcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
  .wcard.total{grid-column:1/-1;border-color:var(--ink);border-width:2px;grid-template-columns:96px 1fr}
  .wcard.total .thumb{width:96px;height:96px}
  .wcard .cat{font-size:12px;font-weight:600;color:var(--muted)}
  .wcard .t{font-family:var(--display);font-size:24px;line-height:1;margin:2px 0}
  .wcard.total .t{font-size:40px}
  .wcard .s{font-size:12px;color:var(--muted)}

  /* vs page */
  .h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;text-align:center;margin-top:10px}
  .h2h .side{display:flex;flex-direction:column;align-items:center;gap:8px}
  .h2h .side .can{width:min(38vw,200px)}
  .h2h .pct{font-family:var(--display);font-size:clamp(44px,8vw,80px);line-height:1}
  .h2h .side.a .pct{color:var(--red)}.h2h .side.b .pct{color:var(--blue)}
  .bar{height:14px;border-radius:999px;background:var(--blue);overflow:hidden;margin:18px 0 6px}
  .bar i{display:block;height:100%;background:var(--red)}
  .btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .btn{font-weight:600;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.ghost{background:none;color:var(--ink)}
  .btn.red{background:var(--red);border-color:var(--red)}.btn.blue{background:var(--blue);border-color:var(--blue)}

  /* brands */
  .brandrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .brandrow .t{font-family:var(--display);font-size:26px;line-height:1}
  .brandrow .bar{margin:6px 0 0;height:8px}
  .bvb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:14px 0}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(16,24,32,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal[hidden]{display:none}
  .modal .box{background:var(--paper);border-radius:18px;max-width:420px;width:100%;padding:16px;text-align:center;max-height:92dvh;display:flex;flex-direction:column;min-height:0}
  .modal h2{margin:0 0 4px;font-size:44px}
  .modal canvas{width:auto;max-width:100%;image-rendering:auto;flex:1;min-height:0;object-fit:contain;border-radius:10px;border:1px solid var(--line);margin:10px auto;display:block}
  .modal .acts{flex:none;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #gate{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
  #gate[hidden]{display:none}
  #gate .box{max-width:420px;text-align:center}
  #gate h2{font-family:var(--display);font-size:64px;margin:0 0 8px}
  #gate p{color:var(--muted);margin:0 0 22px;font-size:15px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
  .toast.show{opacity:1}

  @media (max-width:640px){
    html,body{overflow-x:hidden;max-width:100vw}
    header{padding:8px 12px;flex-wrap:wrap;align-items:center;gap:8px;row-gap:6px}
    header .logo{flex:none}
    nav{order:3;width:100%;padding-bottom:2px;scroll-snap-type:x proximity}
    nav a{scroll-snap-align:start;font-size:12px;padding:6px 10px}
    .sel{order:2}
    .sel select{font-size:12px;max-width:82px;padding:5px 6px}
    .modal{padding:10px}
    .modal .box{padding:12px;max-height:94dvh}
    .modal h2{font-size:26px;margin:0}
    .modal .sub{font-size:13px;margin:2px 0 0}
    .modal canvas{margin:8px auto}
    .logo{font-size:26px}
    .arena{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .seam{left:0;right:0;top:50%;bottom:auto;border-left:0;border-top:2px dashed var(--line)}
    .corner{padding:8px 16px;gap:4px}
    .corner.left{padding-bottom:40px}.corner.right{padding-top:40px}
    .can{width:min(20vh,150px)}
    .brand{font-size:12px}.name{font-size:clamp(26px,7vw,36px)}.meta{font-size:13px}
    .streak{font-size:12px}
    .vs{width:58px;height:58px;font-size:30px;box-shadow:0 0 0 4px var(--paper)}
    .hint{padding:8px 14px;font-size:12px}.hint .keys{display:none}
    .scroll{padding:18px 14px 80px}
    ol.list li{grid-template-columns:36px 48px 1fr auto;gap:8px}
    ol.list .rank{font-size:28px}ol.list .t{font-size:20px}
  }
</style>
<style>
  html.gated main, html.gated header, html.gated footer{display:none !important}
  html.gated #gate{display:flex !important}
</style>
<script>document.documentElement.classList.add('gated');</script>
<style>
  footer#foot{flex:none;border-top:1px solid var(--line);background:var(--paper)}
  footer#foot .fw{max-width:760px;margin:0 auto;padding:12px 20px;font-size:11px;line-height:1.5;color:var(--muted);text-align:center}
  footer#foot p{margin:0 0 3px}
  footer#foot p:last-child{margin:0}
  footer#foot a{color:var(--muted)}
  footer#foot #footShort{display:none}
  @media (max-width:640px){
    footer#foot .fw{padding:7px 14px;font-size:10px}
    footer#foot #footLegal,footer#foot #footNic,footer#foot #footTm{display:none}
    footer#foot #footShort{display:block}
    .corner{padding:4px 14px;gap:2px}
    .can{width:min(17vh,128px)}
    .name{font-size:clamp(20px,5.6vw,28px);line-height:1.05}
    .brand{font-size:11px}
    .meta{font-size:12px}
    .dots{transform:scale(.85)}
    .hint{padding:6px 14px;font-size:11px}
    .vs{width:52px;height:52px;font-size:26px}
  }
</style>
<style>
  .cgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start;margin:24px 0}
  .cslot{display:flex;flex-direction:column;gap:8px;min-width:0}
  .clabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .csearch{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1px solid #d6d6d6;border-radius:12px;background:#fff;color:#111}
  .cres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:380px;overflow:auto}
  .cres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:6px 8px;border:0;border-radius:10px;background:transparent;cursor:pointer;font:inherit;color:inherit}
  .cres button:hover,.cres button:focus{background:rgba(0,0,0,.06)}
  .cres img,.cres .cthumb{width:44px;height:44px;flex:0 0 44px;object-fit:contain;border-radius:8px;background:#f2f2f2}
  .cres small{display:block;color:var(--muted);font-size:12px}
  .cnone{color:var(--muted);padding:8px}
  .cpick{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
  .btn[disabled]{opacity:.4;pointer-events:none}
  @media (max-width:700px){.cgrid{grid-template-columns:1fr}.cgrid>.vs{justify-self:center}}
</style>
<style>.logo img{height:34px;width:auto;display:block}@media (max-width:700px){.logo img{height:26px}}</style>
<style>/* mörk ram */
  header{background:#1a1a1c;border-bottom-color:#2c2c2f}
  nav a{color:#e8e8ea;border-color:#3a3a3e}
  nav a:hover{border-color:#77777d}
  nav a[aria-current="page"]{background:#d4a93c;color:#151516;border-color:#d4a93c}
  header select,header .sel select{background:#26262a;color:#e8e8ea;border-color:#3a3a3e}
  .hint{background:#1a1a1c;color:#a1a1a8;border-top-color:#2c2c2f}
  .hint kbd{background:#26262a;color:#e8e8ea;border-color:#3a3a3e}
  .hint button{color:#e8e8ea}
  footer{background:#151516;color:#a1a1a8;border-top-color:#2c2c2f}
  footer a{color:#d0d0d4}
</style>
<style>/* kompakt mörk sidfot */
  html body #foot{background:#151516;color:#a1a1a8;border-top:1px solid #2c2c2f;padding:8px 16px;font-size:12px;line-height:1.5}
  html body #foot a{color:#d0d0d4}
  html body #foot #footLegal,html body #foot #footNic,html body #foot #footTm{display:none}
  html body #foot #footShort{display:block;margin:0}
</style>
<style>/* klickbara vs-sidor */
  .h2h .side{cursor:pointer;border-radius:18px;padding:12px 8px;transition:background .15s}
  @media (hover:hover) and (pointer:fine){.h2h .side:hover{background:#f5f5f6}}
  .h2h .side .btn{margin-top:12px;max-width:100%;white-space:normal}
</style>
</head>
<body>

<header>
  <a class="logo" href="/" data-route="duel" id="logo"></a>
  <nav>
    <a href="/" data-route="duel">Duell</a>
    <a href="/topplistan" data-route="top">Topplistan</a>
    <a href="/manadens-mastare" data-route="month">Månadens mästare</a>
    <a href="/varumarken" data-route="brands">Märken &amp; tillverkare</a>
    <a href="/skapa" data-route="create">Skapa duell</a>
  </nav>
  <div class="sel">
    <select id="lang" aria-label="Language"></select>
    <select id="country" aria-label="Land" title="Land"></select>
  </div>
</header>

<main>
  <section id="v-duel" class="view">
    <div class="arena">
      <button class="corner left" id="cornerL" aria-label="Rösta på vänster"></button>
      <div class="seam"></div><div class="vs">VS</div>
      <button class="corner right" id="cornerR" aria-label="Rösta på höger"></button>
    </div>
    <div class="hint">
      <span id="duelHint"></span>
      <span class="acts"><button id="share-duel">Dela duellen</button><button id="skip">Skippa</button></span>
    </div>
  </section>

  <section id="v-top" class="view"><div class="scroll"><div class="wrap">
    <h1 id="topH">Topplistan</h1>
    <p class="sub" id="topSub"></p>
    <div class="tabs" id="topTabs">
      <button class="chip" data-tab="all" aria-pressed="true">Alla tider</button>
      <button class="chip" data-tab="recent" aria-pressed="false">Senaste 30 dagarna</button>
      <button class="chip" data-tab="hot" aria-pressed="false">Mest omdiskuterat</button>
      <button class="chip" data-tab="mine" aria-pressed="false">Min lista</button>
    </div>
    <div class="filters" id="filters"></div>
    <ol class="list" id="topList"></ol>
    <div id="mineActions" class="btnrow" hidden><button class="btn" id="mineShare">Skapa mitt resultatkort</button></div>
  </div></div></section>

  <section id="v-month" class="view"><div class="scroll"><div class="wrap">
    <h1 id="monthH">Månadens mästare</h1>
    <p class="sub" id="monthSub"></p>
    <div class="tabs" id="monthTabs"></div>
    <div id="monthBody"></div>
  </div></div></section>

  <section id="v-brands" class="view"><div class="scroll"><div class="wrap">
    <h1 id="bTitle">Varumärkeskampen</h1>
    <p class="sub" id="bSub">Andel vunna dueller mot andra varumärken. Dueller inom samma märke räknas inte.</p>
    <div class="tabs" id="bMode">
      <button class="chip" data-mode="brand" aria-pressed="true">Varumärken</button>
      <button class="chip" data-mode="maker" aria-pressed="false">Tillverkare</button>
    </div>
    <div class="bvb"><select id="bA"></select><span class="vs" style="position:static;transform:rotate(-8deg);width:56px;height:56px;font-size:28px;box-shadow:none"></span><select id="bB"></select></div>
    <div id="bvbResult"></div>
    <h2 id="bListTitle">Alla varumärken</h2>
    <div id="brandList"></div>
  </div></div></section>

  <section id="v-create" class="view"><div class="scroll"><div class="wrap" id="createBody"></div></div></section>
  <section id="v-vs" class="view"><div class="scroll"><div class="wrap" id="vsBody"></div></div></section>
</main>
<footer id="foot"><div class="fw">
  <p id="footLegal"></p>
  <p id="footNic"></p>
  <p id="footTm"></p>
  <p id="footShort"></p>
  <p id="footLinks"><a id="footAbout"></a> · <a id="footRank"></a> · <a id="footContact"></a> · <a id="footPriv"></a></p>
</div></footer>

<div id="gate"><div class="box"><h2>18+</h2><p id="gateText"></p>
  <div class="btnrow"><button class="btn" id="gateYes">Jag är 18 eller äldre</button><button class="btn ghost" id="gateNo">Nej</button></div></div></div>

<div class="modal" id="cardModal" hidden><div class="box">
  <h2 id="cardH" style="font-family:var(--display)">Din topp 5</h2>
  <p class="sub" id="cardSub"></p>
  <canvas id="card" width="1080" height="1920"></canvas>
  <div class="btnrow"><button class="btn" id="cardShare">Dela</button><button class="btn ghost" id="cardSave">Spara bild</button><button class="btn ghost" id="cardClose">Fortsätt rösta</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="products.js"></script>
<script src="images.js" onerror="window.IMAGES={}"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const P = window.PRODUCTS.filter(p => p.active !== false);
  const ALL = window.PRODUCTS;
  const byId = Object.fromEntries(ALL.map(p => [p.id, p]));
  const cfg = window.SNUSKAMPEN_CONFIG || {};
  const sb = (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
  const HOST=(location.hostname||'').replace(/^www\./,'').toLowerCase();
  const SITE = /snuskampen\.se$/.test(HOST)
    ? {a:'SNUS',b:'KAMPEN',name:'Snuskampen',domain:'snuskampen.se',lang:'sv',country:'SE',fixed:true}
    : {a:'SNUS',b:'BATTLE',name:'Snusbattle',domain:'snusbattle.com',lang:'en',country:null,fixed:false};
  const I18N = window.I18N || {LANGS:[{code:'sv',label:'Svenska'}],T:{sv:{ui:{},flavor:{}}}};
  // nationell domän → dess språk vinner över webbläsaren; .com → webbläsarens språk om det finns
  const guessLang = () => { if(SITE.fixed) return SITE.lang; const l=(navigator.language||'').toLowerCase().slice(0,2); return I18N.T[l] ? l : SITE.lang; };
  let LANG = (new URLSearchParams(location.search).get('lang')||'').toLowerCase();
  if(!I18N.T[LANG]) LANG = null;
  const MIN_DUELS = 5;          // för att få vara med i månads-/kategorilistor
  const CARD_EVERY = 10;        // resultatkort efter var 10:e röst

  const $ = s => document.querySelector(s);
  const store = { get(k,d){ try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch{return d;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} } };
  const session = store.get('sk_session') || (()=>{const s=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set('sk_session',s);return s;})();
  const COUNTRIES=[['SE','🇸🇪 Sverige'],['NO','🇳🇴 Norge'],['DK','🇩🇰 Danmark'],['FI','🇫🇮 Suomi'],['IS','🇮🇸 Ísland'],
    ['DE','🇩🇪 Deutschland'],['AT','🇦🇹 Österreich'],['CH','🇨🇭 Schweiz'],['NL','🇳🇱 Nederland'],['BE','🇧🇪 België'],
    ['GB','🇬🇧 United Kingdom'],['IE','🇮🇪 Ireland'],['US','🇺🇸 United States'],['CA','🇨🇦 Canada'],
    ['PL','🇵🇱 Polska'],['CZ','🇨🇿 Česko'],['SK','🇸🇰 Slovensko'],['SI','🇸🇮 Slovenija'],['HR','🇭🇷 Hrvatska'],
    ['EE','🇪🇪 Eesti'],['LV','🇱🇻 Latvija'],['LT','🇱🇹 Lietuva'],
    ['IT','🇮🇹 Italia'],['ES','🇪🇸 España'],['PT','🇵🇹 Portugal'],['FR','🇫🇷 France'],
    ['KR','🇰🇷 대한민국'],['JP','🇯🇵 日本'],['AU','🇦🇺 Australia'],['NZ','🇳🇿 New Zealand'],
    ['ZA','🇿🇦 South Africa'],['AE','🇦🇪 United Arab Emirates'],['XX','🌍 —']];
  const LANG2C={sv:'SE',no:'NO',da:'DK',fi:'FI',is:'IS',de:'DE',en:'GB',pl:'PL',sk:'SK',sl:'SI',hr:'HR',et:'EE',lv:'LV',it:'IT',es:'ES',fr:'FR',ko:'KR'};
  const C2LANG={SE:'sv',NO:'no',DK:'da',FI:'fi',IS:'is',DE:'de',AT:'de',CH:'de',NL:'en',BE:'fr',GB:'en',IE:'en',US:'en',CA:'en',
    PL:'pl',CZ:'sk',SK:'sk',SI:'sl',HR:'hr',EE:'et',LV:'lv',LT:'lv',IT:'it',ES:'es',PT:'es',FR:'fr',KR:'ko',JP:'en',AU:'en',NZ:'en',ZA:'en',AE:'en',XX:'en'};
  const guessCountry=()=>{ const l=(navigator.language||'').toUpperCase(); const m=l.match(/-([A-Z]{2})/);
    if(SITE.country) return SITE.country;
    if(m&&COUNTRIES.some(c=>c[0]===m[1])) return m[1];
    const base=(navigator.language||'').toLowerCase().slice(0,2); return LANG2C[base]||'XX'; };
  LANG = LANG || store.get('sk_lang') || guessLang();
  const t = (k,v) => { let s = (I18N.T[LANG]?.ui?.[k]) ?? (I18N.T.sv.ui[k]) ?? k; if(v) for(const x in v) s=s.split('{'+x+'}').join(v[x]); return s; };
  const tf = f => (I18N.T[LANG]?.flavor?.[f]) ?? f;
  let country = store.get('sk_country') || guessCountry();
  let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); };
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const pct = (w,d) => d ? Math.round(100*w/d) : 0;

  // ---- taxonomi
  const STRKEY = d => d<=2?'mild':d===3?'normal':d===4?'strong':'xstrong';
  const FCOUNT = P.reduce((a,p)=>(a[p.flavor]=(a[p.flavor]||0)+1,a),{});
  const FAMS = Object.keys(FCOUNT).sort((a,b)=>FCOUNT[b]-FCOUNT[a]||a.localeCompare(b,'sv'));
  const STRS = ['mild','normal','strong','xstrong'];
  const BRANDS = [...new Set(P.map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,'sv'));
  const MAKERS = [...new Set(P.map(p=>p.maker))].sort((a,b)=>a.localeCompare(b,'sv'));
  const FORMATS = ['Mini','Slim','Superslim','Large'].filter(f=>P.some(p=>p.format===f));
  const STYLES = ['White','White Dry','Original'].filter(s=>P.some(p=>p.style===s));
  ALL.forEach(p=>{ p._fam=p.flavor; p._str=STRKEY(p.dots); });

  // ---- render helpers
  const hue={}; const hueOf = b => { if(!(b in hue)){let h=0;for(const c of b)h=(h*31+c.charCodeAt(0))%360;hue[b]=h;} return hue[b]; };
  const colorFor = b => `hsl(${hueOf(b)} 55% 42%)`;
  const dots = n => '<span class="dots">'+Array.from({length:6},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')+'</span>';

  // grafisk dosa som fallback tills riktig produktbild finns i /img/
  function canSvg(p, small){
    const h=hueOf(p.brand);
    const lid=`hsl(${h} 58% 46%)`, side=`hsl(${h} 58% 33%)`, gloss=`hsl(${h} 50% 60%)`;
    const brand=esc(p.brand.toUpperCase());
    const bs = brand.length>14 ? 17 : brand.length>10 ? 21 : 26;
    // dosa sedd snett ovanifrån: bred ellips, låg sarg
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${brand}">
      <ellipse cx="100" cy="132" rx="86" ry="34" fill="${side}"/>
      <rect x="14" y="96" width="172" height="36" fill="${side}"/>
      <ellipse cx="100" cy="96" rx="86" ry="34" fill="${lid}"/>
      <ellipse cx="100" cy="92" rx="72" ry="26" fill="${gloss}" opacity=".45"/>
      <ellipse cx="100" cy="96" rx="86" ry="34" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/>
      <text x="100" y="${small?104:103}" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="${small?30:bs}" fill="#fff" letter-spacing="1">${brand}</text>
    </svg>`;
  }
  const IMAGES = window.IMAGES || {};
  const imgHtml = (p,cls) => IMAGES[p.id]
    ? `<div class="${cls}"><img src="/img/${esc(IMAGES[p.id])}" alt="" loading="lazy" data-pid="${esc(p.id)}" data-small="${cls==='thumb'?1:0}" onerror="window.__snusFallback(this)"></div>`
    : `<div class="${cls}"><div class="fallback">${canSvg(p, cls==='thumb')}</div></div>`;
  window.__snusFallback = el => { const p=byId[el.dataset.pid]; if(!p){el.remove();return;} const d=document.createElement('div'); d.className='fallback'; d.innerHTML=canSvg(p, el.dataset.small==='1'); el.replaceWith(d); };
  const label = p => `${p.brand} ${p.name}`;
  const tmg = s => !s || LANG==='sv' ? s : String(s).replace(/prilla/g,'pouch').replace(/(\d),(\d)/g,'$1.$2');
  const sub = p => [p.format, p.style, tf(p.flavor), tmg(p.mg)].filter(Boolean).join(' · ');
  const vsUrl = (a,b) => `/vs/${a}/${b}`;

  // ---- local ratings
  const local = store.get('sk_local_ratings', {});
  let myVotes = store.get('sk_votes', 0);
  function eloLocal(w,l){ const rw=local[w]?.r??1500, rl=local[l]?.r??1500, k=32, ew=1/(1+Math.pow(10,(rl-rw)/400));
    local[w]={r:rw+k*(1-ew),w:(local[w]?.w||0)+1,l:local[w]?.l||0}; local[l]={r:rl-k*(1-ew),w:local[l]?.w||0,l:(local[l]?.l||0)+1}; store.set('sk_local_ratings',local); }
  async function recordVote(w,l){
    eloLocal(w,l); myVotes++; store.set('sk_votes',myVotes);
    if (myVotes % CARD_EVERY === 0) setTimeout(()=>openCard(), 350);
    if (!sb) return;
    const {error} = await sb.rpc('cast_vote',{p_winner:w,p_loser:l,p_session:session,p_country:country});
    if (error){ console.warn(error); toast(t('not_saved')); }
  }

  // ---- duel
  let champ, chall, streak=0; const recent=[];
  const CROSS_BRAND = 0.75;   // andel dueller som föredrar ett annat varumärke
  function pick(ex,otherBrand){
    let pool=P.filter(p=>!ex.includes(p.id)&&!recent.includes(p.id));
    if(!pool.length) pool=P.filter(p=>!ex.includes(p.id));
    if(otherBrand && Math.random()<CROSS_BRAND){ const q=pool.filter(p=>p.brand!==otherBrand); if(q.length) pool=q; }
    const p=pool[Math.floor(Math.random()*pool.length)]; recent.push(p.id); if(recent.length>12)recent.shift(); return p; }
  function renderCorner(el,p,isChamp){ el.dataset.id=p.id; el.innerHTML=`${imgHtml(p,'can')}<span class="brand">${esc(p.brand)}</span><h2 class="name" style="margin:0">${esc(p.name)}</h2><p class="meta">${esc([p.format,p.style,tf(p.flavor)].filter(Boolean).join(' · '))}</p><p class="meta">${dots(p.dots)}${esc(tmg(p.mg))}</p>${isChamp&&streak>0?`<span class="streak">${streak>1?streak+(LANG==='sv'?' raka vinster':' wins in a row'):(LANG==='sv'?'1 vinst':'1 win')}</span>`:''}`; }
  function draw(){ renderCorner($('#cornerL'),champ,true); renderCorner($('#cornerR'),chall,false); }
  function startDuel(a,b){ champ=a||pick([]); chall=b||pick([champ.id],champ.brand); streak=0; draw(); }
  function vote(side){ const winner=side==='L'?champ:chall, loser=side==='L'?chall:champ, el=side==='L'?$('#cornerL'):$('#cornerR');
    el.classList.remove('won'); void el.offsetWidth; el.classList.add('won');
    streak = winner===champ ? streak+1 : 1; champ=winner; chall=pick([champ.id,loser.id],champ.brand); draw(); recordVote(winner.id,loser.id); }
  $('#cornerL').addEventListener('click',()=>vote('L')); $('#cornerR').addEventListener('click',()=>vote('R'));
  $('#skip').addEventListener('click',()=>{chall=pick([champ.id,chall.id],champ.brand);draw();});
  $('#share-duel').addEventListener('click',()=>shareLink(location.origin+vsUrl(champ.id,chall.id)+(LANG!==SITE.lang?'?lang='+LANG:''),`${label(champ)} vs ${label(chall)}`));
  document.addEventListener('keydown',e=>{ if(route!=='duel'||!$('#gate').hidden)return; if(e.key==='ArrowLeft')vote('L'); else if(e.key==='ArrowRight')vote('R'); else if(e.key.toLowerCase()==='s')$('#skip').click(); });
  async function shareLink(url,title){ if(navigator.share){ try{await navigator.share({title,url});return;}catch{} } try{await navigator.clipboard.writeText(url);toast(t('copied'));}catch{toast(url);} }

  // ---- data fetch (cached per view)
  const cache={};
  async function q(name,fn){ if(!sb) return null; if(cache[name]) return cache[name]; const {data,error}=await fn(); if(error){console.warn(error);return null;} cache[name]=data; return data; }
  const getRatings = () => q('ratings',()=>sb.from('ratings').select('product_id,rating,wins,losses,duels').order('rating',{ascending:false}).limit(2000));
  const getRecent  = () => q('recent',()=>sb.from('recent_stats').select('*').limit(2000));
  const getMonthly = () => q('monthly',()=>sb.from('monthly_stats').select('*').limit(20000));
  const getH2H     = () => q('h2h',()=>sb.from('h2h').select('*').limit(50000));

  // ---- filters
  const F={type:'all',str:'all',fam:'all',fmt:'all',style:'all',brand:'all'};
  function renderFilters(){
    const chips=(key,opts)=>opts.map(([v,l])=>`<button class="chip sm" data-f="${key}" data-v="${esc(v)}" aria-pressed="${F[key]===v}">${esc(l)}</button>`).join('');
    $('#filters').innerHTML=`
      <div class="frow"><span class="lbl">${esc(t('f_cat'))}</span>${chips('type',[['all',t('all')],['vit',t('pouches')],['tobak',t('tobacco')]])}</div>
      <div class="frow"><span class="lbl">${esc(t('f_str'))}</span>${chips('str',[['all',t('all')],...STRS.map(s=>[s,t(s)])])}</div>
      <div class="frow"><span class="lbl">${esc(t('f_flavor'))}</span><select id="famSel"><option value="all">${esc(t('all_flavors'))}</option>${FAMS.map(s=>`<option value="${esc(s)}" ${F.fam===s?'selected':''}>${esc(tf(s))} (${FCOUNT[s]})</option>`).join('')}</select></div>
      <div class="frow"><span class="lbl">${esc(t('f_format'))}</span>${chips('fmt',[['all',t('all')],...FORMATS.map(s=>[s,s])])}</div>
      <div class="frow"><span class="lbl">${esc(t('f_style'))}</span>${chips('style',[['all',t('all')],...STYLES.map(s=>[s,s])])}</div>
      <div class="frow"><span class="lbl">${esc(t('f_brand'))}</span><select id="brandSel"><option value="all">${esc(t('all_brands'))}</option>${BRANDS.map(b=>`<option ${F.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
    $('#filters').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{F[b.dataset.f]=b.dataset.v;renderFilters();renderTop();}));
    $('#brandSel').addEventListener('change',e=>{F.brand=e.target.value;renderTop();});
    $('#famSel').addEventListener('change',e=>{F.fam=e.target.value;renderTop();});
  }
  const passes = p => p && (F.type==='all'||p.type===F.type) && (F.str==='all'||p._str===F.str) && (F.fam==='all'||p._fam===F.fam) && (F.fmt==='all'||p.format===F.fmt) && (F.style==='all'||p.style===F.style) && (F.brand==='all'||p.brand===F.brand);

  // ---- topplistan
  let topTab='all';
  $('#topTabs').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{topTab=b.dataset.tab;$('#topTabs').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));renderTop();}));
  function listHtml(rows,scoreFn){
    if(!rows.length) return '<li class="empty">Inga produkter matchar ännu. Rösta några dueller så fylls listan.</li>';
    return rows.slice(0,100).map((r,i)=>{const p=byId[r.product_id];const [big,small]=scoreFn(r);return `<li><span class="rank">${i+1}</span>${imgHtml(p,'thumb')}<div><div class="t"><a href="/vs/${p.id}/${(champ||P[0]).id}" data-utmana="${p.id}">${esc(label(p))}</a></div><div class="s">${esc(sub(p))}</div></div><div class="score"><b>${big}</b><span>${small}</span></div></li>`;}).join('');
  }
  async function renderTop(){
    const list=$('#topList'); $('#mineActions').hidden = topTab!=='mine';
    let rows=[]; let subtxt='';
    if(topTab==='mine'){
      rows=Object.entries(local).map(([id,v])=>({product_id:id,rating:v.r,wins:v.w,losses:v.l,duels:v.w+v.l})).sort((a,b)=>b.rating-a.rating);
      subtxt=t('top_sub_mine',{n:myVotes});
    } else if(!sb){ subtxt=''; }
    else if(topTab==='all'){ rows=(await getRatings())||[]; subtxt=t('top_sub_all',{n:Math.floor(rows.reduce((a,r)=>a+r.duels,0)/2)}); }
    else if(topTab==='recent'){ rows=((await getRecent())||[]).map(r=>({...r,duels:r.wins+r.losses})).filter(r=>r.duels>=MIN_DUELS).sort((a,b)=>pct(b.wins,b.duels)-pct(a.wins,a.duels)||b.duels-a.duels); subtxt=t('top_sub_recent',{m:MIN_DUELS}); }
    else if(topTab==='hot'){ rows=((await getRatings())||[]).filter(r=>r.duels>=MIN_DUELS*2).map(r=>({...r,_d:Math.abs(50-pct(r.wins,r.duels))})).sort((a,b)=>a._d-b._d||b.duels-a.duels); subtxt=t('top_sub_hot'); }
    rows=rows.filter(r=>passes(byId[r.product_id]));
    $('#topSub').textContent=subtxt;
    list.innerHTML=listHtml(rows,r=>[pct(r.wins,r.duels)+'%',t('wins_duels',{d:r.duels})]);
    list.querySelectorAll('[data-utmana]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();startDuel(byId[a.dataset.utmana]);go('duel');}));
  }
  $('#mineShare').addEventListener('click',openCard);

  // ---- månadens mästare
  let monthSel=null;
  async function renderMonth(){
    const data=(await getMonthly())||[];
    const months=[...new Set(data.map(r=>r.month))].sort().reverse();
    const nowM=new Date().toISOString().slice(0,7)+'-01'; if(!months.includes(nowM)) months.unshift(nowM);
    if(!monthSel||!months.includes(monthSel)) monthSel=months[0];
    const fmtM=m=>new Date(m).toLocaleDateString(LANG,{month:'long',year:'numeric'});
    $('#monthTabs').innerHTML=months.slice(0,12).map(m=>`<button class="chip" data-m="${m}" aria-pressed="${m===monthSel}">${esc(fmtM(m))}</button>`).join('');
    $('#monthTabs').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{monthSel=b.dataset.m;renderMonth();}));
    const rows=data.filter(r=>r.month===monthSel&&byId[r.product_id]).map(r=>({...r,duels:r.wins+r.losses,p:byId[r.product_id]}));
    const total=rows.reduce((a,r)=>a+r.duels,0)/2;
    const best=(pred)=>rows.filter(r=>r.duels>=MIN_DUELS&&pred(r.p)).sort((a,b)=>pct(b.wins,b.duels)-pct(a.wins,a.duels)||b.duels-a.duels)[0];
    const card=(cat,r,cls='')=>r?`<div class="wcard ${cls}">${imgHtml(r.p,'thumb')}<div><div class="cat">${esc(cat)}</div><div class="t">${esc(label(r.p))}</div><div class="s">${pct(r.wins,r.duels)}% ${esc(t('wins_duels',{d:r.duels}))}</div></div></div>`:`<div class="wcard ${cls}"><div></div><div><div class="cat">${esc(cat)}</div><div class="s">${esc(t('month_none',{m:MIN_DUELS}))}</div></div></div>`;
    const B=x=>t('best',{x});
    const cats=[[B(t('pouches').toLowerCase()),p=>p.type==='vit'],[B(t('tobacco').toLowerCase()),p=>p.type==='tobak'],
      ...FORMATS.map(f=>[B(f.toLowerCase()),p=>p.format===f]),
      ...STYLES.map(s=>[B(s.toLowerCase()),p=>p.style===s]),
      ...STRS.map(s=>[B(t(s).toLowerCase()),p=>p._str===s]),
      ...FAMS.filter(f=>FCOUNT[f]>=8&&f!=='Övrigt').map(f=>[B(tf(f).toLowerCase()),p=>p._fam===f])];
    const mAgg={}; rows.forEach(r=>{const k=r.p.maker;mAgg[k]=mAgg[k]||{w:0,d:0};mAgg[k].w+=r.wins;mAgg[k].d+=r.duels;});
    const mBest=Object.entries(mAgg).filter(([,v])=>v.d>=MIN_DUELS*3).map(([k,v])=>({k,...v})).sort((a,b)=>pct(b.w,b.d)-pct(a.w,a.d)||b.d-a.d)[0];
    const makerCard=mBest?`<div class="wcard"><div></div><div><div class="cat">${esc(t('month_maker'))}</div><div class="t">${esc(mBest.k)}</div><div class="s">${pct(mBest.w,mBest.d)}% ${esc(t('wins_duels',{d:mBest.d}))}</div></div></div>`:'';
    $('#monthBody').innerHTML=`<p class="note">${esc(t('month_count',{n:Math.floor(total),m:fmtM(monthSel)}))}${monthSel===nowM?esc(t('month_ongoing')):''}</p>
      <div class="winners">${card(t('month_total'),best(()=>true),'total')}${makerCard}${cats.map(([c,f])=>card(c,best(f))).join('')}</div>`;
  }

  // ---- varumärken
  let bMode='brand';
  const bKey = p => bMode==='brand' ? p.brand : p.maker;
  document.querySelectorAll('#bMode .chip').forEach(b=>b.addEventListener('click',()=>{
    bMode=b.dataset.mode; document.querySelectorAll('#bMode .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#bA').innerHTML=''; renderBrands();
  }));
  async function renderBrands(){
    const isBrand = bMode==='brand';
    $('#bTitle').textContent = isBrand ? t('brand_title') : t('maker_title');
    $('#bSub').textContent = isBrand ? t('brand_sub') : t('maker_sub');
    $('#bListTitle').textContent = isBrand ? t('all_brands_h') : t('all_makers_h');
    const list = isBrand ? BRANDS : MAKERS;
    const h=(await getH2H())||[];
    const agg={}; const pair={};
    for(const r of h){ const A=byId[r.a],B=byId[r.b]; if(!A||!B) continue;
      const ka=bKey(A), kb=bKey(B); if(ka===kb) continue;
      const add=(x,w,l)=>{agg[x]=agg[x]||{w:0,l:0};agg[x].w+=w;agg[x].l+=l;};
      add(ka,r.a_wins,r.b_wins); add(kb,r.b_wins,r.a_wins);
      const k=[ka,kb].sort().join('|'); pair[k]=pair[k]||{}; pair[k][ka]=(pair[k][ka]||0)+r.a_wins; pair[k][kb]=(pair[k][kb]||0)+r.b_wins; }
    const rows=Object.entries(agg).map(([b,v])=>({b,w:v.w,l:v.l,d:v.w+v.l})).filter(r=>r.d>=MIN_DUELS).sort((a,b)=>pct(b.w,b.d)-pct(a.w,a.d)||b.d-a.d);
    $('#brandList').innerHTML=rows.length?rows.map((r,i)=>`<div class="brandrow"><span class="rank" style="font-family:var(--display);font-size:30px">${i+1}</span><div><div class="t">${esc(r.b)}</div><div class="bar"><i style="width:${pct(r.w,r.d)}%"></i></div></div><div class="score" style="text-align:right"><b style="font-family:var(--display);font-size:24px;display:block">${pct(r.w,r.d)}%</b><span style="font-size:11px;color:var(--muted)">${r.d} dueller</span></div></div>`).join(''):`<p class="empty">${esc(t('too_few',{x:isBrand?t('brands_l'):t('makers_l')}))}</p>`;
    const opts=list.map(b=>`<option>${esc(b)}</option>`).join('');
    if(!$('#bA').options.length){ $('#bA').innerHTML=opts; $('#bB').innerHTML=opts;
      $('#bA').value=list.find(b=>/zyn|swedish match/i.test(b))||list[0];
      $('#bB').value=list.find(b=>/velo|bat/i.test(b))||list[1]||list[0];
      $('#bA').onchange=$('#bB').onchange=show; }
    function show(){ const a=$('#bA').value,b=$('#bB').value; const k=[a,b].sort().join('|'); const v=pair[k]||{}; const aw=v[a]||0,bw=v[b]||0,d=aw+bw;
      $('#bvbResult').innerHTML=d?`<div class="h2h"><div class="side a"><div class="pct">${pct(aw,d)}%</div><div class="brand">${esc(a)}</div></div><div></div><div class="side b"><div class="pct">${pct(bw,d)}%</div><div class="brand">${esc(b)}</div></div></div><div class="bar"><i style="width:${pct(aw,d)}%"></i></div><p class="note" style="text-align:center">${esc(t('duels_between',{n:d,a,b}))}</p>`:`<p class="empty" style="text-align:center">${esc(t('none_between',{a,b}))}</p>`; }
    show();
  }

  // ---- vs-sida
  async function renderVs(aId,bId){
    const A=byId[aId],B=byId[bId]; const body=$('#vsBody');
    if(!A||!B){ body.innerHTML=`<h1>${esc(t('vs_notfound'))}</h1><p class="sub">${esc(t('vs_notfound_sub'))}</p><a class="btn" href="/">${esc(t('to_duel'))}</a>`; return; }
    document.title=`${label(A)} vs ${label(B)} – Snuskampen`; document.documentElement.lang=LANG;
    let aw=0,bw=0;
    if(sb){ const [x,y]=[aId,bId].sort(); const {data}=await sb.from('h2h').select('*').eq('a',x).eq('b',y).maybeSingle(); if(data){ aw=x===aId?data.a_wins:data.b_wins; bw=x===aId?data.b_wins:data.a_wins; } }
    const d=aw+bw;
    body.innerHTML=`<h1 style="text-align:center;font-size:clamp(28px,7vw,56px)">${esc(label(A))} <span style="color:var(--muted)">vs</span> ${esc(label(B))}</h1>
      <div class="h2h">
        <div class="side a">${imgHtml(A,'can')}<div class="brand">${esc(A.brand)}</div><div class="name" style="font-size:clamp(24px,4vw,40px)">${esc(A.name)}</div><div class="meta">${esc(sub(A))}</div><div class="pct">${d?pct(aw,d)+'%':''}</div><button class="btn red" type="button">${esc(t('wins_btn',{x:label(A)}))}</button></div>
        <div class="vs" style="position:static;transform:rotate(-8deg);width:56px;height:56px;font-size:28px;box-shadow:none;margin-top:60px">VS</div>
        <div class="side b">${imgHtml(B,'can')}<div class="brand">${esc(B.brand)}</div><div class="name" style="font-size:clamp(24px,4vw,40px)">${esc(B.name)}</div><div class="meta">${esc(sub(B))}</div><div class="pct">${d?pct(bw,d)+'%':''}</div><button class="btn blue" type="button">${esc(t('wins_btn',{x:label(B)}))}</button></div>
      </div>
      
      ${d?`<div class="bar"><i style="width:${pct(aw,d)}%"></i></div><p class="note" style="text-align:center">${esc(t('h2h_count',{n:d}))}</p>`:`<p class="empty" style="text-align:center">${esc(t('vs_none'))}</p>`}
      <div class="btnrow"><button class="btn ghost" id="vsShare">${esc(t('share'))}</button><a class="btn ghost" href="/">${esc(t('random'))}</a><button class="btn ghost" id="vsCreate">${esc(ct('nav'))}</button></div>`;
    let vsBusy=false; const voteVs=(w,l)=>{ if(vsBusy) return; vsBusy=true; recordVote(w.id,l.id); toast(`${label(w)} +1`); delete cache.h2h; setTimeout(()=>renderVs(aId,bId),400); };
    body.querySelector('.side.a').onclick=()=>voteVs(A,B); body.querySelector('.side.b').onclick=()=>voteVs(B,A);
    $('#vsCreate').onclick=()=>{cSel={a:A,b:null};go('create');window.scrollTo(0,0);}; $('#vsShare').onclick=()=>shareLink(location.origin+location.pathname+(LANG!==SITE.lang?'?lang='+LANG:''),`${label(A)} vs ${label(B)}`);
  }

  // ---- resultatkort
  function myTop(n){ return Object.entries(local).map(([id,v])=>({p:byId[id],r:v.r,w:v.w,l:v.l})).filter(x=>x.p&&x.w+x.l>=2).sort((a,b)=>b.r-a.r).slice(0,n); }
  function drawCan(x, p, cx, cy, r){
    const h=hueOf(p.brand);
    const lid=`hsl(${h} 58% 46%)`, side=`hsl(${h} 58% 33%)`, gloss=`hsl(${h} 50% 60%)`;
    const w=r, ry=r*0.40, bodyH=r*0.42;
    x.fillStyle=side; x.beginPath(); x.ellipse(cx,cy+bodyH,w,ry,0,0,Math.PI*2); x.fill();
    x.fillRect(cx-w,cy,w*2,bodyH);
    x.fillStyle=lid; x.beginPath(); x.ellipse(cx,cy,w,ry,0,0,Math.PI*2); x.fill();
    x.fillStyle=gloss; x.globalAlpha=.45; x.beginPath(); x.ellipse(cx,cy-r*0.05,w*0.83,ry*0.76,0,0,Math.PI*2); x.fill(); x.globalAlpha=1;
    x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
    fit(x,p.brand.toUpperCase(),w*1.6,'34px "Bebas Neue"');
    x.fillText(p.brand.toUpperCase(),cx,cy+2);
    x.textAlign='left'; x.textBaseline='alphabetic';
  }
  function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
  function drawPhoto(x, im, cx, cy, r){
    const s = Math.min((r*2.1)/im.width, (r*2.1)/im.height);
    const w = im.width*s, hh = im.height*s;
    x.drawImage(im, cx-w/2, cy-hh/2, w, hh);
  }
  function fit(x, text, max, font){ let s=parseInt(font); x.font=font; while(x.measureText(text).width>max && s>20){ s-=2; x.font=font.replace(/^\d+/, s); } return x.font; }
  async function openCard(){
    const top=myTop(5); if(top.length<3){ toast(t('vote_more')); return; }
    try{ await document.fonts.load('120px "Bebas Neue"'); await document.fonts.load('600 40px Archivo'); await document.fonts.ready; }catch{}
    const pics = await Promise.all(top.map(t => IMAGES[t.p.id] ? loadImg('/img/'+IMAGES[t.p.id]) : Promise.resolve(null)));
    const c=$('#card'),x=c.getContext('2d'),W=c.width,H=c.height;
    x.fillStyle='#fff';x.fillRect(0,0,W,H);
    x.textAlign='left';x.textBaseline='alphabetic';
    x.fillStyle='#101820';x.font='120px "Bebas Neue"';x.fillText(SITE.a,80,190);let w=x.measureText(SITE.a).width;x.fillStyle='#e4002b';x.fillText(SITE.b,80+w,190);
    x.fillStyle='#6b7280';x.font='600 40px Archivo';x.fillText(t('card_head',{n:myVotes}),80,260);
    top.forEach((t,i)=>{const y=420+i*260;
      x.fillStyle=i===0?'#e4002b':'#101820';x.font='150px "Bebas Neue"';x.fillText(String(i+1),80,y+110);
      if(pics[i]) drawPhoto(x, pics[i], 340, y+70, 92); else drawCan(x, t.p, 340, y+70, 92);
      x.fillStyle='#101820';fit(x,t.p.name.toUpperCase(),W-540,'72px "Bebas Neue"');x.fillText(t.p.name.toUpperCase(),470,y+70);
      const meta=[t.p.format,t.p.style,tmg(t.p.mg||'').split(' · ')[0]].filter(Boolean).join(' · ');
      x.fillStyle='#6b7280';fit(x,meta,W-540,'600 34px Archivo');x.fillText(meta,470,y+125);
      x.fillStyle='#e6e6e6';x.fillRect(80,y+200,W-160,3);});
    x.fillStyle='#101820';x.font='70px "Bebas Neue"';x.textAlign='center';const cta=t('card_cta').toUpperCase();fit(x,cta,W-120,'70px "Bebas Neue"');x.fillText(cta,W/2,H-200);x.fillStyle='#e4002b';x.font='90px "Bebas Neue"';x.fillText(SITE.domain.toUpperCase(),W/2,H-100);x.textAlign='left';
    $('#cardSub').textContent=t('card_after',{n:myVotes}); $('#cardModal').hidden=false;
  }
  $('#cardClose').onclick=()=>$('#cardModal').hidden=true;
  $('#cardSave').onclick=()=>{const a=document.createElement('a');a.download='snuskampen-topp5.png';a.href=$('#card').toDataURL('image/png');a.click();};
  $('#cardShare').onclick=async()=>{ $('#card').toBlob(async b=>{ const f=new File([b],'snuskampen-topp5.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ try{await navigator.share({files:[f],title:'Min topp 5 på Snuskampen',url:location.origin});}catch{} } else $('#cardSave').click(); }); };

  // ---- skapa duell
  const CT = {
    sv:{nav:'Skapa duell',h:'Skapa din egen duell',sub:'Välj två snus och få en länk att dela.',ph:'Sök märke, smak eller produkt…',a:'Snus 1',b:'Snus 2',go:'Skapa duell',copy:'Kopiera länk',copied:'Länk kopierad',none:'Inga träffar',same:'Välj två olika produkter',change:'Byt'},
    en:{nav:'Create battle',h:'Create your own battle',sub:'Pick two pouches and get a link to share.',ph:'Search brand, flavour or product…',a:'Pouch 1',b:'Pouch 2',go:'Create battle',copy:'Copy link',copied:'Link copied',none:'No matches',same:'Pick two different products',change:'Change'}
  };
  function ct(k){ return (CT[LANG]||CT.en)[k]; }
  let cSel={a:null,b:null};
  const cnorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  function searchProducts(q){
    const w=cnorm(q).split(/\s+/).filter(Boolean); if(!w.length) return [];
    return (window.PRODUCTS||[]).filter(p=>p.active!==false).map(p=>{
      const hay=cnorm(`${p.brand} ${p.name} ${p.flavor||''} ${p.format||''} ${p.maker||''}`);
      if(!w.every(x=>hay.includes(x))) return null;
      return {p, s:(cnorm(p.brand).startsWith(w[0])?0:1)+cnorm(p.name).length/100};
    }).filter(Boolean).sort((x,y)=>x.s-y.s).slice(0,8).map(x=>x.p);
  }
  function cThumb(p){ const f=window.IMAGES&&window.IMAGES[p.id]; return f?`<img src="/img/${esc(f)}" alt="" loading="lazy">`:'<span class="cthumb"></span>'; }
  function renderCreate(){
    const body=$('#createBody'); if(!body) return;
    const slot=k=>{ const p=cSel[k]; return `<div class="cslot">
      <div class="clabel">${esc(ct(k))}</div>
      ${p?`<div class="cpick">${imgHtml(p,'can')}<div class="brand">${esc(p.brand)}</div><div class="name">${esc(p.name)}</div><div class="meta">${esc(sub(p))}</div><button class="btn ghost cchange" data-k="${k}">${esc(ct('change'))}</button></div>`
         :`<input class="csearch" data-k="${k}" type="search" autocomplete="off" placeholder="${esc(ct('ph'))}"><ul class="cres" data-k="${k}"></ul>`}
    </div>`; };
    const ok=!!(cSel.a&&cSel.b&&cSel.a.id!==cSel.b.id);
    body.innerHTML=`<h1>${esc(ct('h'))}</h1><p class="sub">${esc(ct('sub'))}</p>
      <div class="cgrid">${slot('a')}<div class="vs" style="position:static;transform:rotate(-8deg);width:56px;height:56px;font-size:28px;box-shadow:none;align-self:center">VS</div>${slot('b')}</div>
      ${cSel.a&&cSel.b&&!ok?`<p class="empty" style="text-align:center">${esc(ct('same'))}</p>`:''}
      <div class="btnrow"><button class="btn red" id="cGo"${ok?'':' disabled'}>${esc(ct('go'))}</button><button class="btn ghost" id="cCopy"${ok?'':' disabled'}>${esc(ct('copy'))}</button></div>`;
    body.querySelectorAll('.csearch').forEach(inp=>{
      const k=inp.dataset.k, ul=body.querySelector(`.cres[data-k="${k}"]`);
      inp.addEventListener('input',()=>{
        const q=inp.value.trim(); if(q.length<2){ ul.innerHTML=''; return; }
        const r=searchProducts(q);
        ul.innerHTML=r.length?r.map(p=>`<li><button type="button" data-id="${esc(p.id)}">${cThumb(p)}<span><b>${esc(p.brand)}</b> ${esc(p.name)}<small>${esc(sub(p))}</small></span></button></li>`).join(''):`<li class="cnone">${esc(ct('none'))}</li>`;
      });
      ul.addEventListener('click',e=>{ const b=e.target.closest('button[data-id]'); if(!b) return; cSel[k]=byId[b.dataset.id]; renderCreate(); const nx=body.querySelector('.csearch'); if(nx) nx.focus(); });
    });
    body.querySelectorAll('.cchange').forEach(b=>b.onclick=()=>{ cSel[b.dataset.k]=null; renderCreate(); const i=body.querySelector(`.csearch[data-k="${b.dataset.k}"]`); if(i) i.focus(); });
    if(ok){
      const url=`/vs/${encodeURIComponent(cSel.a.id)}/${encodeURIComponent(cSel.b.id)}`;
      $('#cGo').onclick=()=>{ history.pushState(null,'',url); resolve(); window.scrollTo(0,0); };
      $('#cCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(location.origin+url); toast(ct('copied')); }catch(e){ prompt('',location.origin+url); } };
    }
  }

  // ---- routing
  let route='duel';
  const ROUTES={duel:'/',top:'/topplistan',month:'/manadens-mastare',brands:'/varumarken',create:'/skapa'};
  function go(r,push=true){ route=r; document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+r));
    document.querySelectorAll('nav a').forEach(a=>a.dataset.route===r?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
    if(push&&ROUTES[r]&&location.pathname!==ROUTES[r]) history.pushState(null,'',ROUTES[r]);
    if(r==='top'){renderFilters();renderTop();} if(r==='month')renderMonth(); if(r==='brands')renderBrands(); if(r==='create')renderCreate(); if(r!=='vs'){document.title=t('title').replace('Snuskampen',SITE.name); $('#ogt').content=document.title;} }
  function resolve(){ const m=location.pathname.match(/^\/vs\/([^/]+)\/([^/]+)/); if(m){route='vs';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-vs'));document.querySelectorAll('nav a').forEach(a=>a.removeAttribute('aria-current'));renderVs(decodeURIComponent(m[1]),decodeURIComponent(m[2]));return;}
    const r=Object.entries(ROUTES).find(([,p])=>p===location.pathname)?.[0]||(location.hash==='#top'?'top':'duel'); go(r,false); }
  document.querySelectorAll('[data-route]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.route);}));
  document.addEventListener('click',e=>{ const a=e.target.closest('a[href^="/vs/"]'); if(a&&!a.dataset.utmana){e.preventDefault();history.pushState(null,'',a.getAttribute('href'));resolve();} });
  window.addEventListener('popstate',resolve);

  // ---- språk
  function applyLang(){
    document.documentElement.lang = LANG;
    $('#logo').innerHTML = '<img src="/'+(SITE.domain==='snuskampen.se'?'logo-dark.png':'logo-dark-sb.png')+'" alt="'+esc(SITE.name)+'">';
    document.title = t('title').replace('Snuskampen',SITE.name);
    $('#ogt').content = document.title;
    const nav=document.querySelectorAll('nav a');
    nav[0].textContent=t('nav_duel'); nav[1].textContent=t('nav_top'); nav[2].textContent=t('nav_month'); nav[3].textContent=t('nav_brands');
    $('#duelHint').innerHTML = esc(t('duel_hint'))+' <span class="keys"><kbd>←</kbd> <kbd>→</kbd> '+esc(t('vote'))+' · <kbd>S</kbd> '+esc(t('skip'))+'</span>';
    $('#share-duel').textContent=t('share_duel'); $('#skip').textContent=t('skip');
    $('#topH').textContent=t('top_h1');
    const md=$('#metadesc'); if(md) md.content=t('meta_desc');
    const tabs={all:'tab_all',recent:'tab_recent',hot:'tab_hot',mine:'tab_mine'};
    $('#topTabs').querySelectorAll('.chip').forEach(b=>b.textContent=t(tabs[b.dataset.tab]));
    $('#mineShare').textContent=t('make_card');
    $('#monthH').textContent=t('nav_month'); $('#monthSub').textContent=t('month_sub');
    $('#bMode').children[0].textContent=t('nav_brands').split('&')[0].trim(); $('#bMode').children[1].textContent=t('all_makers_h').replace(/^Alla |^All |^Alle |^Kaikki |^Wszyscy |^Tutti i |^Todos los |^Tous les |^Všetci |^Vsi |^Svi |^Allir |^Kõik |^Visi /,'');
    $('#cardH').textContent=t('card_title'); $('#cardShare').textContent=t('share'); $('#cardSave').textContent=t('save_img'); $('#cardClose').textContent=t('keep_voting');
    $('#footLegal').textContent=t('foot_legal').replace('Snuskampen',SITE.name);
    $('#footNic').textContent=t('foot_nic');
    $('#footTm').textContent=t('foot_tm').replace('Snuskampen',SITE.name);
    $('#footShort').textContent=t('foot_short');
    $('#footPriv').textContent=t('foot_priv');
    const SE_ = SITE.domain==='snuskampen.se';
    $('#footPriv').href = SE_ ? '/integritetspolicy' : '/privacy';
    $('#footAbout').textContent=t('foot_about'); $('#footAbout').href = SE_ ? '/om-snuskampen' : '/about';
    $('#footRank').textContent=t('foot_rank');   $('#footRank').href  = SE_ ? '/sa-fungerar-rankingen' : '/how-ranking-works';
    $('#footContact').textContent=t('foot_contact'); $('#footContact').href = SE_ ? '/kontakt' : '/contact';
    $('#gateText').textContent=t('gate_text').replace('Snuskampen',SITE.name); $('#gateYes').textContent=t('gate_yes'); $('#gateNo').textContent=t('gate_no');
    if(route==='top'){renderFilters();renderTop();} if(route==='month')renderMonth(); if(route==='brands'){$('#bA').innerHTML='';renderBrands();}
    if(route==='duel')draw(); if(route==='create')renderCreate(); if(nav[4])nav[4].textContent=ct('nav');
    if(route==='vs'){const m=location.pathname.match(/^\/vs\/([^/]+)\/([^/]+)/); if(m)renderVs(decodeURIComponent(m[1]),decodeURIComponent(m[2]));}
  }
  // hreflang + canonical per domän
  const SE='https://snuskampen.se', COM='https://snusbattle.com';
  const homeOf = l => l==='sv' ? SE : (l==='en' ? COM : COM+'/?lang='+l);
  (function(){ const head=document.head, path=location.pathname;
    const add=(hl,href)=>{const l=document.createElement('link');l.rel='alternate';l.hreflang=hl;l.href=href;head.appendChild(l);};
    const urlFor = l => l==='sv' ? SE+path : (l==='en' ? COM+path : COM+path+'?lang='+l);
    I18N.LANGS.forEach(l=>add(l.code, urlFor(l.code)));
    add('x-default', COM+path);
    let c=$('#canon'); if(!c){c=document.createElement('link');c.rel='canonical';c.id='canon';head.appendChild(c);} c.href=urlFor(LANG); })();
  $('#lang').innerHTML=I18N.LANGS.map(l=>`<option value="${l.code}" ${l.code===LANG?'selected':''}>${esc(l.label)}</option>`).join('');
  $('#lang').addEventListener('change',e=>{LANG=e.target.value;store.set('sk_lang',LANG);store.set('sk_lang_set',true);applyLang();});

  // ---- land
  $('#country').innerHTML=COUNTRIES.map(([c,l])=>`<option value="${c}" ${c===country?'selected':''}>${l}</option>`).join('');
  $('#country').addEventListener('change',e=>{ country=e.target.value; store.set('sk_country',country); store.set('sk_country_set',true);
    if(!store.get('sk_lang_set',false)){ const nl=C2LANG[country]; if(nl && I18N.T[nl] && nl!==LANG){ LANG=nl; $('#lang').value=LANG; store.set('sk_lang',LANG); applyLang(); } } });

  // ---- age gate + start
  const gate=$('#gate'); if(store.get('sk_18',false)){ gate.hidden=true; document.documentElement.classList.remove('gated'); }
  $('#gateYes').onclick=()=>{store.set('sk_18',true);gate.hidden=true;document.documentElement.classList.remove('gated');}; $('#gateNo').onclick=()=>location.href='https://www.1177.se';
  startDuel(); applyLang(); resolve();
})();
</script>
